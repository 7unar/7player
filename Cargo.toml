[package]
name = "seven-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "7player — a NetEase Cloud Music TUI player written in Rust"
license = "MIT"
authors = ["Lunar"]
repository = "https://github.com/7unar/7player"
homepage = "https://7unar.top"
documentation = "https://github.com/7unar/7player#readme"
readme = "README.md"
keywords = ["netease", "music", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "7player"

[lib]
name = "seven_player"
path = "src/lib.rs"

[[bin]]
name = "7player"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
futures-util = "0.3"
libc = "0.2"
md-5 = "0.10"
num-bigint = "0.4"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
rodio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
